name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    # Preserve all non-pytest gates while isolated shards run the complete suite.
    timeout-minutes: 60
    services:
      product-browser-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riftcoach_browser_test
          POSTGRES_USER: riftcoach
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftcoach -d riftcoach_browser_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for isolated evaluation dependencies
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            experiments/pi_runtime/package-lock.json
            experiments/mcp_interop/package-lock.json
            web/package-lock.json

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify current Runtime profile manifests before expensive checks
        run: python -m scripts.check_runtime_profile_manifests

      - name: Verify current inventory snapshots and exact API paths early
        run: >-
          python -m pytest
          tests/test_natural_duty_qualification_inventory.py
          tests/test_sol_review_binding.py::test_inventory_preserves_original15_and_uses_runtime_contract
          tests/test_async_task_api.py::test_openapi_versions_the_async_contract_and_exact_paths
          tests/test_fastapi_adapter.py::test_app_factory_and_openapi_do_not_read_keys_or_open_io
          tests/test_web_task_event_contract.py
          -q --tb=short --show-capture=no

      - name: Install isolated Pi spike dependencies without lifecycle scripts
        working-directory: experiments/pi_runtime
        run: npm ci --ignore-scripts

      - name: Install isolated MCP interoperability dependencies without lifecycle scripts
        working-directory: experiments/mcp_interop
        run: npm ci --ignore-scripts

      - name: Install fixture web dependencies without lifecycle scripts
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Install the isolated Chromium verification browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Verify the fixture web contract and production bundle
        working-directory: web
        run: |
          npm run typecheck
          npm run test:unit
          npm run build
          npm run test:e2e

      - name: Verify browser to real SQL and product Worker with scripted external IO
        env:
          DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_browser_test
          RIFTCOACH_TEST_DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_browser_test
          RIFTCOACH_PRODUCT_BROWSER_CHECK: "1"
          RIFTCOACH_BROWSER_OUTPUT: ${{ runner.temp }}/product-browser
        run: python -m pytest tests/test_sol_product_browser_postgres.py -q --tb=short --show-capture=no

      - name: Preserve product browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-browser
          path: |
            ${{ runner.temp }}/product-browser/**/*.png
            ${{ runner.temp }}/product-browser/**/*proof.json
            ${{ runner.temp }}/product-browser/**/playwright.stdout.txt
            ${{ runner.temp }}/product-browser/**/attempt-state.json
            ${{ runner.temp }}/product-browser/**/trace.zip
            ${{ runner.temp }}/product-browser/**/error-context.md
          if-no-files-found: ignore

      - name: Verify cinematic audit toolchain and planned ledger
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version
          ffmpeg -version
          python scripts/check_cinematic_media.py \
            --manifest docs/assets/8e-portal/cinematic-media-audit-v1.json \
            --root . \
            --json

      - name: Check project governance continuity
        run: python scripts/check_project_governance.py

      - name: Enforce RAG v1 retrieval quality gate
        run: |
          python scripts/evaluate_rag_retrieval.py \
            --provider hybrid \
            --output "${RUNNER_TEMP}/rag-v1-evaluation.json" \
            --min-recall 1.0 \
            --min-mrr 1.0 \
            --min-ndcg 1.0 \
            --max-no-answer-fpr 0.0

      - name: Enforce independent RAG 4M holdout gate
        run: |
          python scripts/evaluate_rag_retrieval.py \
            --provider hybrid \
            --cases data/evaluation/rag_v1_holdout_cases.json \
            --require-independent \
            --output "${RUNNER_TEMP}/rag-v1-holdout-evaluation.json" \
            --min-recall 1.0 \
            --min-mrr 1.0 \
            --min-ndcg 1.0 \
            --max-no-answer-fpr 0.0 \
            --min-abstention-accuracy 1.0 \
            --min-citation-support 1.0

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Enforce Harness SDK boundary
        run: |
          if grep -E "chat\.completions|\.choices" \
            app/harness/adapters.py \
            scripts/run_review_harness.py \
            scripts/generate_llm_coach_report.py \
            scripts/evaluate_coach_report.py \
            scripts/revise_coach_report.py; then
            echo "Production Harness code must use Provider and Tool Runtime contracts."
            exit 1
          fi

      - name: Reject tracked local secrets and run data
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^data/cache/|^data/runs/'; then
            echo "Local secrets or private run data must not be tracked."
            exit 1
          fi

      - name: Run Harness dry-run fixture
        run: |
          python scripts/run_review_harness.py \
            --summary examples/fixtures/player_summary_demo.json \
            --deterministic-report examples/fixtures/deterministic_report_demo.md \
            --runs-root "${RUNNER_TEMP}/riftcoach-runs" \
            --run-id ci_harness_v1 \
            --dry-run

  pytest-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for isolated evaluation dependencies
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            experiments/pi_runtime/package-lock.json
            experiments/mcp_interop/package-lock.json
            web/package-lock.json

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install isolated Pi spike dependencies without lifecycle scripts
        working-directory: experiments/pi_runtime
        run: npm ci --ignore-scripts

      - name: Install isolated MCP interoperability dependencies without lifecycle scripts
        working-directory: experiments/mcp_interop
        run: npm ci --ignore-scripts

      - name: Install fixture web dependencies without lifecycle scripts
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Install the isolated Chromium verification browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install media toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Run an isolated slice of the complete collected suite
        run: >-
          python -m scripts.ci_test_shards run
          --index "${{ matrix.shard }}" --count 4
          --manifest "${{ runner.temp }}/shard-${{ matrix.shard }}.json"
          -- -q --tb=short --show-capture=no --durations=20

      - name: Retain collection and completion inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  pytest:
    runs-on: ubuntu-latest
    needs: [web-checks, pytest-shards]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Require all unchanged gates and every shard to succeed
        env:
          WEB_RESULT: ${{ needs.web-checks.result }}
          SHARD_RESULT: ${{ needs.pytest-shards.result }}
        run: test "$WEB_RESULT" = success && test "$SHARD_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install inventory verifier dependencies
        run: python -m pip install -e ".[dev]"

      - name: Download every shard inventory
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*
          path: ${{ runner.temp }}/pytest-inventory
          merge-multiple: true

      - name: Verify exact full-suite coverage and completed tests
        run: >-
          python -m scripts.ci_test_shards verify
          --directory "${{ runner.temp }}/pytest-inventory" --count 4

  postgres-tests:
    runs-on: ubuntu-latest
    # Each shard owns a separate runner and PostgreSQL service.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_test
      RIFTCOACH_TEST_DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riftcoach_test
          POSTGRES_USER: riftcoach
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftcoach -d riftcoach_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check project governance continuity
        run: python scripts/check_project_governance.py

      - name: Run an isolated slice of every PostgreSQL control-plane test
        run: >-
          python -m scripts.ci_test_shards run
          --index "${{ matrix.shard }}" --count 4
          --test-list tests/postgres_ci_files.txt
          --manifest "${{ runner.temp }}/shard-${{ matrix.shard }}.json"
          -- -vv --tb=short --show-capture=no --durations=20

      - name: Retain PostgreSQL collection and completion inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.json
          if-no-files-found: error

  postgres-migrations:
    runs-on: ubuntu-latest
    # Keep the migration gate and require exact, non-skipped SQL coverage.
    needs: [postgres-tests]
    if: always()
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_test
      RIFTCOACH_TEST_DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riftcoach_test
          POSTGRES_USER: riftcoach
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftcoach -d riftcoach_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Require every PostgreSQL shard to succeed
        env:
          POSTGRES_RESULT: ${{ needs.postgres-tests.result }}
        run: test "$POSTGRES_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check project governance continuity
        run: python scripts/check_project_governance.py

      - name: Verify reversible PostgreSQL migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Download every PostgreSQL shard inventory
        uses: actions/download-artifact@v4
        with:
          pattern: postgres-shard-*
          path: ${{ runner.temp }}/postgres-inventory
          merge-multiple: true

      - name: Verify exact PostgreSQL coverage with no skipped tests
        run: >-
          python -m scripts.ci_test_shards verify
          --directory "${{ runner.temp }}/postgres-inventory" --count 4
          --require-no-skips

      - name: Verify metadata matches the migration head
        run: |
          python -m alembic upgrade head
          python -m alembic check

  packaging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: riftcoach-packaging-smoke
      RIFTCOACH_LOCAL_OWNER_ID: packaging-smoke-owner

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate the Compose model
        run: docker compose --profile smoke config --quiet

      - name: Build and start the isolated API stack
        run: >-
          docker compose --profile smoke up --build --detach --wait
          --wait-timeout 120 api

      - name: Run the no-I/O Linux package smoke
        run: docker compose --profile smoke run --rm --no-deps smoke

      - name: Print bounded service diagnostics after smoke failure
        if: failure()
        run: |
          docker compose --profile smoke ps --all
          docker compose --profile smoke logs --no-color --tail 100 api postgres

      - name: Inspect runtime image boundary
        run: |
          docker run --rm --entrypoint sh riftcoach-agent:local -c '
            test "$(id -u)" != "0"
            test ! -e /opt/riftcoach/.env
            test ! -d /opt/riftcoach/tests
            test ! -d /opt/riftcoach/data/cache
            test ! -d /opt/riftcoach/data/runs
            test ! -d /opt/riftcoach/reports
            test ! -d /opt/riftcoach/tmp
          '

      - name: Tear down package smoke resources
        if: always()
        run: docker compose --profile smoke down -v --remove-orphans
