name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node for isolated Pi spike
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: experiments/pi_runtime/package-lock.json

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install isolated Pi spike dependencies without lifecycle scripts
        working-directory: experiments/pi_runtime
        run: npm ci --ignore-scripts

      - name: Check project governance continuity
        run: python scripts/check_project_governance.py

      - name: Run tests
        run: python -m pytest -q

      - name: Enforce RAG v1 retrieval quality gate
        run: |
          python scripts/evaluate_rag_retrieval.py \
            --provider hybrid \
            --output "${RUNNER_TEMP}/rag-v1-evaluation.json" \
            --min-recall 1.0 \
            --min-mrr 1.0 \
            --min-ndcg 1.0 \
            --max-no-answer-fpr 0.0

      - name: Enforce independent RAG 4M holdout gate
        run: |
          python scripts/evaluate_rag_retrieval.py \
            --provider hybrid \
            --cases data/evaluation/rag_v1_holdout_cases.json \
            --require-independent \
            --output "${RUNNER_TEMP}/rag-v1-holdout-evaluation.json" \
            --min-recall 1.0 \
            --min-mrr 1.0 \
            --min-ndcg 1.0 \
            --max-no-answer-fpr 0.0 \
            --min-abstention-accuracy 1.0 \
            --min-citation-support 1.0

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Enforce Harness SDK boundary
        run: |
          if grep -E "chat\.completions|\.choices" \
            app/harness/adapters.py \
            scripts/run_review_harness.py \
            scripts/generate_llm_coach_report.py \
            scripts/evaluate_coach_report.py \
            scripts/revise_coach_report.py; then
            echo "Production Harness code must use Provider and Tool Runtime contracts."
            exit 1
          fi

      - name: Reject tracked local secrets and run data
        run: |
          if git ls-files | grep -E '(^|/)\.env$|^data/cache/|^data/runs/'; then
            echo "Local secrets or private run data must not be tracked."
            exit 1
          fi

      - name: Run Harness dry-run fixture
        run: |
          python scripts/run_review_harness.py \
            --summary examples/fixtures/player_summary_demo.json \
            --deterministic-report examples/fixtures/deterministic_report_demo.md \
            --runs-root "${RUNNER_TEMP}/riftcoach-runs" \
            --run-id ci_harness_v1 \
            --dry-run

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_test
      RIFTCOACH_TEST_DATABASE_URL: postgresql+psycopg://riftcoach:ci-only@localhost:5432/riftcoach_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: riftcoach_test
          POSTGRES_USER: riftcoach
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riftcoach -d riftcoach_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check project governance continuity
        run: python scripts/check_project_governance.py

      - name: Verify reversible PostgreSQL migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run PostgreSQL task tests
        run: |
          python -m pytest \
            tests/test_database_config.py \
            tests/test_task_migrations_postgres.py \
            tests/test_task_repository_postgres.py \
            tests/test_task_claim_postgres.py \
            tests/test_task_reconciliation_postgres.py \
            tests/test_task_product_vertical_postgres.py \
            tests/test_async_task_api_postgres.py \
            -q

      - name: Verify metadata matches the migration head
        run: |
          python -m alembic upgrade head
          python -m alembic check
