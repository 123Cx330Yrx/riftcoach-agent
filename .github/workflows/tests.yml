name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run Harness dry-run fixture
        run: |
          python scripts/run_review_harness.py \
            --summary examples/fixtures/player_summary_demo.json \
            --deterministic-report examples/fixtures/deterministic_report_demo.md \
            --runs-root "${RUNNER_TEMP}/riftcoach-runs" \
            --run-id ci_harness_v1 \
            --dry-run
