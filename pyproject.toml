[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftcoach-agent"
version = "0.1.0"
description = "A data-grounded League of Legends post-game coaching agent."
requires-python = ">=3.11"

dependencies = [
    "jsonschema>=4,<5",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "requests",
    "python-dotenv",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
