[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riftcoach-agent"
version = "0.1.0"
description = "A data-grounded League of Legends post-game coaching agent."
requires-python = ">=3.11"

dependencies = [
    "jsonschema>=4,<5",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
